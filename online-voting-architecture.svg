<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #1f2937; }
      .section { font: 700 20px Arial, sans-serif; fill: #111827; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .small { font: 500 13px Arial, sans-serif; fill: #374151; }
      .box { fill: #f8fafc; stroke: #475569; stroke-width: 2; rx: 16; }
      .layer { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 14; }
      .service { fill: #ecfeff; stroke: #0f766e; stroke-width: 2; rx: 12; }
      .db { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 12; }
      .sec { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 12; }
      .arrow { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 8 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="60" text-anchor="middle" class="title">Online Voting System Architecture</text>

  <!-- Client Layer -->
  <rect x="60" y="120" width="1260" height="180" class="layer"/>
  <text x="90" y="155" class="section">Client Layer</text>

  <rect x="95" y="185" width="220" height="80" class="box"/>
  <text x="205" y="220" text-anchor="middle" class="label">Voter Web App</text>
  <text x="205" y="240" text-anchor="middle" class="small">Login, ballot, vote</text>

  <rect x="365" y="185" width="220" height="80" class="box"/>
  <text x="475" y="220" text-anchor="middle" class="label">Admin Dashboard</text>
  <text x="475" y="240" text-anchor="middle" class="small">Create election, monitor</text>

  <rect x="635" y="185" width="220" height="80" class="box"/>
  <text x="745" y="220" text-anchor="middle" class="label">Election Officer UI</text>
  <text x="745" y="240" text-anchor="middle" class="small">Verify, audit, review</text>

  <rect x="905" y="185" width="220" height="80" class="box"/>
  <text x="1015" y="220" text-anchor="middle" class="label">Mobile App</text>
  <text x="1015" y="240" text-anchor="middle" class="small">Optional access</text>

  <!-- Security Layer -->
  <rect x="60" y="340" width="1260" height="120" class="layer"/>
  <text x="90" y="375" class="section">Security &amp; Access</text>

  <rect x="110" y="395" width="180" height="45" class="sec"/>
  <text x="200" y="424" text-anchor="middle" class="label">Authentication</text>

  <rect x="330" y="395" width="180" height="45" class="sec"/>
  <text x="420" y="424" text-anchor="middle" class="label">OTP / MFA</text>

  <rect x="550" y="395" width="180" height="45" class="sec"/>
  <text x="640" y="424" text-anchor="middle" class="label">Role Based Access</text>

  <rect x="770" y="395" width="180" height="45" class="sec"/>
  <text x="860" y="424" text-anchor="middle" class="label">WAF / Firewall</text>

  <rect x="990" y="395" width="180" height="45" class="sec"/>
  <text x="1080" y="424" text-anchor="middle" class="label">Rate Limiting</text>

  <!-- API & App Layer -->
  <rect x="60" y="500" width="1260" height="220" class="layer"/>
  <text x="90" y="535" class="section">Application Layer</text>

  <rect x="110" y="560" width="180" height="110" class="service"/>
  <text x="200" y="595" text-anchor="middle" class="label">API Gateway</text>
  <text x="200" y="615" text-anchor="middle" class="small">Routing, auth, load</text>
  <text x="200" y="633" text-anchor="middle" class="small">balancing</text>

  <rect x="340" y="560" width="180" height="110" class="service"/>
  <text x="430" y="595" text-anchor="middle" class="label">Vote Service</text>
  <text x="430" y="615" text-anchor="middle" class="small">Validate vote</text>
  <text x="430" y="633" text-anchor="middle" class="small">single-vote logic</text>

  <rect x="570" y="560" width="180" height="110" class="service"/>
  <text x="660" y="595" text-anchor="middle" class="label">Election Service</text>
  <text x="660" y="615" text-anchor="middle" class="small">Candidate, ballot,</text>
  <text x="660" y="633" text-anchor="middle" class="small">schedule setup</text>

  <rect x="800" y="560" width="180" height="110" class="service"/>
  <text x="890" y="595" text-anchor="middle" class="label">User Service</text>
  <text x="890" y="615" text-anchor="middle" class="small">Profile, eligibility</text>
  <text x="890" y="633" text-anchor="middle" class="small">and access</text>

  <rect x="1030" y="560" width="180" height="110" class="service"/>
  <text x="1120" y="595" text-anchor="middle" class="label">Result Service</text>
  <text x="1120" y="615" text-anchor="middle" class="small">Aggregate votes</text>
  <text x="1120" y="633" text-anchor="middle" class="small">publish results</text>

  <!-- Data Layer -->
  <rect x="60" y="760" width="1260" height="90" class="layer"/>
  <text x="90" y="795" class="section">Data &amp; Audit Layer</text>

  <rect x="110" y="810" width="360" height="20" class="db"/>
  <text x="290" y="826" text-anchor="middle" class="label">Relational Database: Users, Elections, Ballots, Votes</text>

  <rect x="520" y="810" width="240" height="20" class="db"/>
  <text x="640" y="826" text-anchor="middle" class="label">Audit Log Database</text>

  <rect x="810" y="810" width="330" height="20" class="db"/>
  <text x="975" y="826" text-anchor="middle" class="label">Object Storage / reports / backups</text>

  <!-- arrows from clients to security and app -->
  <path d="M205 265 L205 395" class="arrow"/>
  <path d="M475 265 L475 395" class="arrow"/>
  <path d="M745 265 L745 395" class="arrow"/>
  <path d="M1015 265 L1015 395" class="arrow"/>

  <path d="M200 440 L200 560" class="arrow"/>
  <path d="M420 440 L420 560" class="arrow"/>
  <path d="M640 440 L640 560" class="arrow"/>
  <path d="M860 440 L860 560" class="arrow"/>
  <path d="M1080 440 L1080 560" class="arrow"/>

  <path d="M290 615 L340 615" class="arrow"/>
  <path d="M520 615 L570 615" class="arrow"/>
  <path d="M750 615 L800 615" class="arrow"/>
  <path d="M980 615 L1030 615" class="arrow"/>

  <path d="M200 670 L200 810" class="arrow"/>
  <path d="M430 670 L430 810" class="arrow"/>
  <path d="M660 670 L660 810" class="arrow"/>
  <path d="M890 670 L890 810" class="arrow"/>
  <path d="M1120 670 L1120 810" class="arrow"/>

  <!-- Additional services -->
  <rect x="60" y="730" width="1260" height="20" fill="none"/>

  <!-- legend -->
  <text x="1020" y="110" class="small">Legend: secure flow, app flow, database flow</text>
</svg>
